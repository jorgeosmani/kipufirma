name: Reportar un error
description: Algo no funciona como se espera
labels: [error]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **No adjunte su certificado .p12, su contraseña ni documentos con datos personales.**
        Para vulnerabilidades de seguridad use el reporte privado (ver SECURITY.md).
  - type: input
    id: version
    attributes: {label: Versión de KipuFirma, placeholder: "1.0.0"}
    validations: {required: true}
  - type: input
    id: so
    attributes: {label: Sistema operativo, placeholder: "Windows 11 23H2"}
  - type: input
    id: ecep
    attributes: {label: Entidad emisora del certificado, placeholder: "Security Data, BCE, Uanataca…"}
  - type: textarea
    id: pasos
    attributes: {label: Pasos para reproducir}
    validations: {required: true}
  - type: textarea
    id: esperado
    attributes: {label: Resultado esperado y resultado obtenido}
  - type: textarea
    id: log
    attributes:
      label: Registro (sin datos sensibles)
      description: "%LOCALAPPDATA%\\KipuFirma\\logs\\kipufirma.log — revise antes de pegar."
      render: text
